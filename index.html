<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="description" content="A quiet place to practise engineering concepts, one question at a time." />
    <title>eng-recall — Engineering flashcards</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8dff7'/%3E%3Ctext x='11' y='42' font-family='monospace' font-size='29' fill='%232f2940'%3Eer%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app" id="app">
      <header class="masthead">
        <div class="brand">eng-recall<span class="brand-period">.</span></div>
        <div class="count" id="count" aria-live="polite">— / —</div>
      </header>

      <div class="workspace">
        <div class="toolbar">
          <label class="topic-picker" for="category">
            <span class="picker-dot" id="picker-dot" aria-hidden="true"></span>
            <select id="category" aria-label="Choose category"></select>
            <svg aria-hidden="true" viewBox="0 0 20 20" width="16" height="16"><path d="m5 7 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </label>
          <span class="difficulty" id="difficulty"></span>
        </div>

        <section class="question-card" id="question-card" aria-labelledby="question">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="question"></h1>
          <div class="progress-track" role="progressbar" id="progress" aria-label="Card progress" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progress-fill"></div></div>
        </section>

        <div class="bottom-area">
          <section class="answer-panel" id="answer-panel">
            <button class="answer-toggle" id="answer-toggle" type="button" aria-expanded="false" aria-controls="answer-content">
              <span id="answer-label">Reveal answer</span>
              <svg class="chevron" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="answer-content" id="answer-content" hidden>
              <p class="answer-kicker">THE ANSWER</p>
              <p class="answer-text" id="answer-text"></p>
              <a class="source-link" id="source-link" target="_blank" rel="noopener noreferrer">View in Notion <span aria-hidden="true">↗</span></a>
            </div>
          </section>
          <button class="next-button" id="next-button" type="button">Next card <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </main>
  </body>
</html>
